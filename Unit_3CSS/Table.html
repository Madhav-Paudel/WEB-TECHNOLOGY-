<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table css</title>
</head>
<style>
  table
  {
    width: 50%;
    border-collapse: collapse;
    text-align: center;
  }
  th,td
  {
    padding: 10px;
  }
  tr:hover
  {
    background-color: lightgray;
  }
  
</style>
<body>
  <table border="2px">
  <th>Name</th>
  <th>Age</th>
  <th>City</th>
  <tr>  
    <td>Madhav</td>
    <td>20</td>
    <td>Butwal</td>
  </tr>
  <tr>  
    <td>Ram</td>
    <td>22</td>
    <td>Kathmandu</td>
  </tr>
  <tr>  
    <td>Shyam</td>
    <td>21</td>
    <td>Pokhara</td>
  </tr> 

  </table>
  
</body>
</html>
