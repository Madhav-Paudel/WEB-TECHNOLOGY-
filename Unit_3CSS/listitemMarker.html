<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List Item Marker</title>
</head>
<style>
  ul
  {
    list-style-image: url("/image/wp2821247.jpg");
  }
  li
  {
    background-color: blue;
  }
  .a
  {
    list-style-position: inside;
  }
  .b
  {
    list-style-position: outside;
  }
</style>
<body>
  <ul class="a">
    <li>I am Madhav</li>
    <li>I am Madhav</li>
    <li>I am Madhav</li>
    <li>I am Madhav</li>
    <li>I am Madhav</li>
    <li>I am Madhav</li>
  </ul>
    <ul class="b">
    <li>I am Madhav</li>
    <li>I am Madhav</li>
    <li>I am Madhav</li>
    <li>I am Madhav</li>
    <li>I am Madhav</li>
    <li>I am Madhav</li>
  </ul>
</body>
</html>
